
name: Construir AURA 7.0 — Cerebro Local Gratis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar paquete AURA 7.0
        run: |
          set -e
          test -f AURA_7_0_Free_Local_Autonomous.zip
          unzip -t AURA_7_0_Free_Local_Autonomous.zip

      - name: Extraer AURA 7.0
        run: |
          set -e
          rm -rf /tmp/aura
          mkdir -p /tmp/aura
          unzip -q AURA_7_0_Free_Local_Autonomous.zip -d /tmp/aura
          test -d /tmp/aura/AURA_7_0_Free_Local_Autonomous/android

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Descargar llama.cpp verificado
        run: |
          set -e
          git clone --depth 1 --branch b10516 \
            https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = "b95502b"

      - name: Preparar proyecto Android
        run: |
          set -e
          cd /tmp/aura/AURA_7_0_Free_Local_Autonomous/android

          rm -rf lib gradle gradlew gradlew.bat
          rm -f settings.gradle settings.gradle.kts
          rm -f build.gradle build.gradle.kts
          rm -f app/build.gradle

          cp -R /tmp/llama.cpp/examples/llama.android/lib .
          cp -R /tmp/llama.cpp/examples/llama.android/gradle .
          cp /tmp/llama.cpp/examples/llama.android/gradlew .
          cp /tmp/llama.cpp/examples/llama.android/gradlew.bat .
          cp /tmp/llama.cpp/examples/llama.android/settings.gradle.kts .
          cp /tmp/llama.cpp/examples/llama.android/build.gradle.kts .
          cp /tmp/llama.cpp/examples/llama.android/gradle.properties .

          chmod +x gradlew

      - name: Compilar APK
        working-directory: /tmp/aura/AURA_7_0_Free_Local_Autonomous/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-7.0-free-local-apk
          path: /tmp/aura/AURA_7_0_Free_Local_Autonomous/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
